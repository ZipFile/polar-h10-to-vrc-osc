<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Polar H10 HR</title>
        <style>
body {
    padding: 0;
    margin: 0;
    background: transparent;
    overflow: hidden;
}

p {
    font-size: 100vmin;
    font-family: monospace;
    line-height: 1;
    color: Canvas;
    margin: 0;
    padding: 0;
    text-align: center;
    -webkit-text-stroke: 8vmin CanvasText;
    paint-order: stroke fill;
}
        </style>
    </head>
    <body>
        <p><span id="prefix"></span><span id="hr">n/a</span><span id="suffix"></span></p>
        <script>
function exponentialBackoff(attempt, base, cap) {
    return Math.random() * Math.min(cap, base * 2**attempt);
}

class WS {
    constructor(url, element) {
        this.url = url;
        this.element = element;
        this.attempt = 0;
    }

    onMessage(event) {
        this.element.textContent = event.data;
    }

    onOpen(event) {
        this.attempt = 0;
    }

    onClose(event) {
        const jitter = exponentialBackoff(++this.attempt, 1000, 60000);

        if (this.attempt < 100) {
            setTimeout(this.connect.bind(this), jitter);
        }
    }

    connect() {
        this.socket = new WebSocket(this.url);
        this.socket.addEventListener("open", this.onOpen.bind(this));
        this.socket.addEventListener("message", this.onMessage.bind(this));
        this.socket.addEventListener("close", this.onClose.bind(this));
    }
}

const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
const host = window.location.host;
const urlParams = new URLSearchParams(window.location.search);
const placeholder = urlParams.get("hr");
const element = document.getElementById("hr");
const ws = new WS(`${protocol}//${host}/hr`, element);

for (const name of ["prefix", "suffix"]) {
    const value = urlParams.get(name);

    if (value) {
        document.getElementById(name).textContent = value
    }
}

if (placeholder) {
    element.textContent = placeholder;
} else {
    ws.connect();
}
        </script>
    </body>
</html>
